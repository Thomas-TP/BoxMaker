[workspace]
members = ["crates/boxmaker-core", "crates/boxmaker-cli", "src-tauri"]
default-members = ["crates/boxmaker-core", "crates/boxmaker-cli"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
