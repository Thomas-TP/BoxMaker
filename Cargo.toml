[workspace]
members = ["crates/boxmaker-core", "crates/boxmaker-cli", "src-tauri"]
default-members = ["crates/boxmaker-core", "crates/boxmaker-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
